name: Production release (visa_os) — audit & migration recovery

# Read-only PRODUCATION audit runs whenever this workflow or the tooling
# changes (so its freshness is always provable). The write path runs ONLY
# when a commit deliberately adds the sentinel file release/PROD_GO — the
# sentinel itself documents intent in git history and is removed together
# with it to make re-runs explicit, never incidental.
#
# Safety model (enforced in scripts/prod-release.ts):
#   - schema pinned to visa_os; Supabase project pinned; ledger must pre-exist.
#   - a surgical in-place restore point is created BEFORE migrating.
#   - migrations run through the same single-transaction, advisory-locked,
#     ledger-guarded runner used in Preview; any failure = full rollback.
#   - postflight proves protected counts / wallet ledger checksum / agency
#     balances / brand settings are byte-identical, else the job FAILS.
on:
  push:
    branches:
      - arena/01a0c3b8-newproject
    paths:
      - .github/workflows/prod-release.yml
      - scripts/prod-release.ts
      - release/PROD_GO
  workflow_dispatch:

concurrency:
  group: prod-release-${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write # post the release report as a commit comment

jobs:
  audit:
    name: "Production DB audit (read-only)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Production
    outputs:
      audit_ran: ${{ steps.guard.outputs.audit_ran }}
      go: ${{ steps.sentinel.outputs.go }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      POSTGRES_URL_POSTGRES: ${{ secrets.POSTGRES_URL_POSTGRES }}
      DIRECT_DATABASE_URL: ${{ secrets.PRODUCTION_DIRECT_DATABASE_URL || secrets.DIRECT_DATABASE_URL }}
      DATABASE_SCHEMA: visa_os
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guard — Production database secret present
        id: guard
        run: |
          PICKED=""
          for NAME in PRODUCTION_DATABASE_URL DATABASE_URL SUPABASE_DATABASE_URL SUPABASE_DB_URL POSTGRES_URL_POSTGRES; do
            VALUE=$(eval "printf %s \"\${$NAME:-}\"")
            if [ -n "$VALUE" ]; then
              PICKED="SOURCE:$NAME"
              echo "DATABASE_URL=$VALUE" >> "$GITHUB_ENV"
              echo "DB_SECRET_NAME=$NAME" >> "$GITHUB_ENV"
              break
            fi
          done
          if [ -z "$PICKED" ]; then
            {
              echo '### Production release — AUDIT report'
              echo
              echo '```'
              echo "GUARD: MISSING Production database connection secret in the 'Production' GitHub environment."
              echo "Tried (all empty/masked): PRODUCTION_DATABASE_URL, DATABASE_URL, SUPABASE_DATABASE_URL, SUPABASE_DB_URL, POSTGRES_URL_POSTGRES."
              echo "→ Settings → Environments → Production → 'Add environment secret':"
              echo "   name  = PRODUCTION_DATABASE_URL"
              echo "   value = the same Supabase pooler URI the visa.essafariavoyages.com deployment uses on Vercel"
              echo "           (Vercel → Project → Settings → Environment Variables → DATABASE_URL (Production) → copy)."
              echo "READ-ONLY audit refused; the database was never contacted."
              echo '```'
            } > /tmp/prod-release-report.md
            echo "read-only audit refused; see report"
            exit 1
          fi
          echo "audit_ran=true" >> "$GITHUB_OUTPUT"
          echo "Using Production env secret: $PICKED (value masked)"

      - name: pnpm 12.5.1
        uses: pnpm/action-setup@v4
        with:
          version: 12.5.1

      - name: Detect release/PROD_GO sentinel in this commit's tree
        id: sentinel
        run: |
          if [ -f release/PROD_GO ]; then echo "go=true" >> "$GITHUB_OUTPUT"; echo "sentinel present: release/PROD_GO (authorization recorded in this commit tree)"; else echo "go=false" >> "$GITHUB_OUTPUT"; fi

      - name: Toolchain
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Dependencies (diagnostics tee to report on failure)
        run: |
          set +e
          (pnpm install --frozen-lockfile --prefer-offline 2>&1 || pnpm install --prefer-offline 2>&1) | tee /tmp/deps.log
          RC=$?
          echo "install rc=$RC"
          if [ "$RC" != "0" ]; then
            { echo '### Production release — environment diagnostics'; echo; echo '```';
              echo "dependency install FAILED (rc=$RC) — tail of output:"; tail -30 /tmp/deps.log; echo '```';
            } > /tmp/prod-release-report.md
            exit "$RC"
          fi
          set -e

      - name: Run read-only Production audit
        run: |
          set +e
          set -o pipefail
          node_modules/tsx/dist/cli.mjs scripts/prod-release.ts audit 2>&1 | tee /tmp/audit.log
          RC=$?
          echo "audit pipeline rc=$RC"
          set +o pipefail
          if [ ! -f /tmp/prod-release-report.md ]; then
            { echo '### Production release — execution diagnostics'; echo; echo '```';
              echo "audit process exited rc=$RC — full output:"; tail -40 /tmp/audit.log; echo '```';
            } > /tmp/prod-release-report.md
          fi
          exit $RC

      - name: Publish report as commit comment
        if: always()
        env:
          WF_REPO: ${{ github.repository }}
          WF_SHA: ${{ github.sha }}
          WF_CONCLUSION: ${{ job.status }}
        run: |
          R=/tmp/prod-release-report.md
          [ -f "$R" ] || printf '### Production release — AUDIT report\n\n```\n(audit did not produce a report — see guard step output)\n```\n' > "$R"
          python3 -c '
          import subprocess, sys, os
          repo = os.environ["WF_REPO"]; sha = os.environ["WF_SHA"]; conclusion = os.environ["WF_CONCLUSION"]
          body = open("/tmp/prod-release-report.md", encoding="utf-8", errors="replace").read() + "\n\nconclusion: " + conclusion
          r = subprocess.run(["gh", "api", "repos/%s/commits/%s/comments" % (repo, sha), "-f", "body=" + body], capture_output=True, text=True)
          print(r.stdout[-300:]); print(r.stderr[-300:], file=sys.stderr)
          '

  apply:
    name: "Apply pending Phase-2 migrations to visa_os (guarded)"
    needs: audit
    if: >-
      github.event_name == 'push' &&
      needs.audit.outputs.go == 'true' &&
      needs.audit.result == 'success'

    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: Production
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      POSTGRES_URL_POSTGRES: ${{ secrets.POSTGRES_URL_POSTGRES }}
      DIRECT_DATABASE_URL: ${{ secrets.PRODUCTION_DIRECT_DATABASE_URL || secrets.DIRECT_DATABASE_URL }}
      DATABASE_SCHEMA: visa_os
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: pnpm 12.5.1
        uses: pnpm/action-setup@v4
        with:
          version: 12.5.1

      - name: Detect release/PROD_GO sentinel in this commit's tree
        id: sentinel
        run: |
          if [ -f release/PROD_GO ]; then echo "go=true" >> "$GITHUB_OUTPUT"; echo "sentinel present: release/PROD_GO (authorization recorded in this commit tree)"; else echo "go=false" >> "$GITHUB_OUTPUT"; fi

      - name: Toolchain
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Dependencies (diagnostics tee to report on failure)
        run: |
          set +e
          (pnpm install --frozen-lockfile --prefer-offline 2>&1 || pnpm install --prefer-offline 2>&1) | tee /tmp/deps.log
          RC=$?
          echo "install rc=$RC"
          if [ "$RC" != "0" ]; then
            { echo '### Production release — environment diagnostics'; echo; echo '```';
              echo "dependency install FAILED (rc=$RC) — tail of output:"; tail -30 /tmp/deps.log; echo '```';
            } > /tmp/prod-release-report.md
            exit "$RC"
          fi
          set -e

      - name: Preflight + restore point + migrations + integrity postflight
        run: node_modules/tsx/dist/cli.mjs scripts/prod-release.ts apply

      - name: Publish report as commit comment
        if: always()
        env:
          WF_REPO: ${{ github.repository }}
          WF_SHA: ${{ github.sha }}
          WF_CONCLUSION: ${{ job.status }}
        run: |
          R=/tmp/prod-release-report.md
          [ -f "$R" ] || printf '### Production release — APPLY report\n\n```\n(apply did not produce a report — step failed before execution)\n```\n' > "$R"
          python3 -c '
          import subprocess, sys, os
          repo = os.environ["WF_REPO"]; sha = os.environ["WF_SHA"]; conclusion = os.environ["WF_CONCLUSION"]
          body = open("/tmp/prod-release-report.md", encoding="utf-8", errors="replace").read() + "\n\nconclusion: " + conclusion
          r = subprocess.run(["gh", "api", "repos/%s/commits/%s/comments" % (repo, sha), "-f", "body=" + body], capture_output=True, text=True)
          print(r.stdout[-300:]); print(r.stderr[-300:], file=sys.stderr)
          '
