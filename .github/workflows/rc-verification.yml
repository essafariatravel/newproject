name: RC deterministic verification

on:
  push:
    branches:
      - release/essafaria-rc-2026-09
      - preprod/essafaria-final-hardening
      - security/pre-codex-gate-2026-10-03
  workflow_dispatch:

concurrency:
  group: rc-deterministic-verification-${{ github.ref }}
  cancel-in-progress: true

# Non-deploying by construction: no environments, no secrets, no deployment
# permissions, no database credentials, and no write permission to the repo.
permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, lint, tests, build
    if: github.ref == 'refs/heads/release/essafaria-rc-2026-09' || github.ref == 'refs/heads/preprod/essafaria-final-hardening' || github.ref == 'refs/heads/security/pre-codex-gate-2026-10-03'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Explicitly prevent build.ts from entering any Vercel Preview DB path.
      VERCEL: "0"
      VERCEL_ENV: ""
      DATABASE_URL: ""
      ALLOW_DEMO_SEED: "false"
      STORAGE_PROVIDER: "db"
      CI: "true"

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Verify checkout
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "Verified commit: $GITHUB_SHA"

      - name: Setup Node 22 with npm cache
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies from package-lock
        run: npm ci --no-audit --no-fund

      - name: Tracked secret and credential artifact gate
        run: npx tsx scripts/security-static-gate.ts

      - name: Historical secret and credential gate
        run: npx tsx scripts/security-history-gate.ts

      - name: Production dependency vulnerability gate
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Targeted build-preview guard
        run: npm test -- tests/build-preview-guard.test.ts

      - name: Broader deterministic test suite
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/test-suite.out
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            {
              echo "### Deterministic test failure excerpt"
              echo '~~~text'
              tail -120 /tmp/test-suite.out
              echo '~~~'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$code"

      - name: Build without deployment or database access
        run: npm run build
