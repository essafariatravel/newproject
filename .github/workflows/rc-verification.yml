name: RC deterministic verification

on:
  push:
    branches:
      - release/essafaria-rc-2026-09
      - release/final-rc-consolidation
      - release/go-live-final-2026-10-06
      - preprod/essafaria-final-hardening
      - security/pre-codex-gate-2026-10-03
  workflow_dispatch:

concurrency:
  group: rc-deterministic-verification-${{ github.ref }}
  cancel-in-progress: true

# Non-deploying by construction: no environments, no secrets, no deployment
# permissions, no database credentials, and no write permission to the repo.
permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, lint, tests, build
    if: github.ref == 'refs/heads/release/final-rc-consolidation' || github.ref == 'refs/heads/release/essafaria-rc-2026-09' || github.ref == 'refs/heads/release/go-live-final-2026-10-06' || github.ref == 'refs/heads/preprod/essafaria-final-hardening' || github.ref == 'refs/heads/security/pre-codex-gate-2026-10-03'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Explicitly prevent build.ts from entering any Vercel Preview DB path.
      VERCEL: "0"
      VERCEL_ENV: ""
      DATABASE_URL: ""
      ALLOW_DEMO_SEED: "false"
      STORAGE_PROVIDER: "db"
      CI: "true"

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Verify checkout
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "Verified commit: $GITHUB_SHA"

      - name: Setup Node 22 with npm cache
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies from package-lock
        run: npm ci --no-audit --no-fund

      - name: Tracked secret and credential artifact gate
        run: npx tsx scripts/security-static-gate.ts

      - name: Historical secret and credential gate
        run: npx tsx scripts/security-history-gate.ts

      - name: Immutable third-party GitHub Actions gate
        run: npx tsx scripts/security-actions-gate.ts

      - name: Dangerous source construct gate
        run: npx tsx scripts/security-source-gate.ts

      - name: Production dependency vulnerability gate
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Shell harness syntax
        run: bash -n scripts/hosted-verify.sh scripts/privacy-runtime-smoke.sh

      - name: Targeted build-preview guard
        run: npm test -- tests/build-preview-guard.test.ts

      - name: Broader deterministic test suite
        run: npm test

      - name: Build without deployment or database access
        run: npm run build

      - name: Local legal/privacy runtime smoke
        shell: bash
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/essafaria
          DATABASE_SCHEMA: public
          STORAGE_PROVIDER: db
          BASE_URL: http://127.0.0.1:3011
          PORT: "3011"
        run: |
          set -euo pipefail
          npm run db:up > /tmp/privacy-pg.log 2>&1 &
          PG_PID=$!
          APP_PID=""
          cleanup() {
            if [ -n "$APP_PID" ]; then kill "$APP_PID" 2>/dev/null || true; fi
            kill "$PG_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          for i in $(seq 1 60); do
            if (echo > /dev/tcp/127.0.0.1/5432) >/dev/null 2>&1; then break; fi
            if [ "$i" = "60" ]; then cat /tmp/privacy-pg.log; exit 1; fi
            sleep 1
          done

          npm run db:migrate
          npm run db:seed

          npm start > /tmp/privacy-next.log 2>&1 &
          APP_PID=$!
          for i in $(seq 1 60); do
            if curl -fsS --max-time 3 "$BASE_URL/" >/dev/null 2>&1; then break; fi
            if [ "$i" = "60" ]; then cat /tmp/privacy-next.log; exit 1; fi
            sleep 1
          done

          bash scripts/privacy-runtime-smoke.sh
