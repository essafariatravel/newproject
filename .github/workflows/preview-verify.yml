name: Hosted Phase-2 Preview verification

# Runs the pure-HTTP hosted verification harness against the consolidated
# Vercel Preview deployment. Executes on every push to the Phase 2 branch;
# also callable via Actions → "Hosted Phase-2 Preview verification" when the
# workflow file exists on the default branch.
on:
  push:
    branches:
      # Hosted verification runs for every session branch that is allowed to
      # verify the Preview deployment. Nothing about the harness or its checks
      # changes — only which branches may execute it.
      - arena/01a0c3b8-newproject
      - arena/01a0ce58-newproject
      - preprod/essafaria-final-hardening
    paths:
      - .github/workflows/preview-verify.yml
      - scripts/hosted-verify.sh
      - src/**
      - migrations/**
  workflow_dispatch:

concurrency:
  group: preview-verify-${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: write # post the gate verdict as a commit comment
  deployments: read

jobs:
  verify:
    name: Verify hosted Preview (Phase 2 flows + Phase 2-Final gate over real HTTP)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PREVIEW_VERIFY_STAFF_EMAIL: ${{ secrets.PREVIEW_VERIFY_STAFF_EMAIL }}
      PREVIEW_VERIFY_STAFF_PASSWORD: ${{ secrets.PREVIEW_VERIFY_STAFF_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve the CURRENT Vercel Preview deployment URL for this commit
        env:
          WF_REPO: ${{ github.repository }}
          WF_SHA: ${{ github.sha }}
        run: |
          BASE_URL=""
          echo "PREVIEW_AVAILABLE=true" >> "$GITHUB_ENV"

          # A Vercel account quota is an external infrastructure condition, not
          # an application regression. When the CURRENT SHA cannot deploy,
          # run the current harness against the latest successful Preview of
          # THIS SAME preprod branch as a clearly-labelled stale diagnostic.
          # This never counts as current-SHA deployment validation.
          VERCEL_DESC=$(gh api "repos/$WF_REPO/commits/$WF_SHA/status" --jq '.statuses[] | select(.context=="Vercel") | .description' 2>/dev/null | head -1 || true)
          if printf '%s' "$VERCEL_DESC" | grep -Eqi 'rate limit|deployment rate limited|daily build|api-deployments-free-per-day'; then
            echo "PREVIEW_CURRENT=false" >> "$GITHUB_ENV"
            echo "Vercel quota detected — looking for the latest successful Preview of the same preprod branch."

            CANDIDATES=$(gh api "repos/$WF_REPO/deployments?environment=Preview&per_page=100" | python3 -c '
          import json, sys
          try:
              deps=json.load(sys.stdin)
          except Exception:
              raise SystemExit(0)
          for d in deps:
              print(str(d.get("id","")) + " " + str(d.get("sha","")))
          ' 2>/dev/null || true)

            while read -r CAND_ID CAND_SHA; do
              [ -n "${CAND_ID:-}" ] || continue
              [ -n "${CAND_SHA:-}" ] || continue
              [ "$CAND_SHA" = "$WF_SHA" ] && continue
              # Vercel/GitHub deployment refs are not consistently populated.
              # Prove same-lineage safety from Git itself: only a Preview whose
              # deployed SHA is an ancestor of the current preprod HEAD is eligible.
              git merge-base --is-ancestor "$CAND_SHA" "$WF_SHA" 2>/dev/null || continue
              ENV_URL=$(gh api "repos/$WF_REPO/deployments/$CAND_ID/statuses" | python3 -c '
          import json, sys
          try:
              sts=json.load(sys.stdin)
          except Exception:
              print(""); raise SystemExit(0)
          for st in sts:
              if st.get("state") == "success" and st.get("environment_url"):
                  print(st["environment_url"]); break
          ' 2>/dev/null || true)
              if [ -n "$ENV_URL" ]; then
                BASE_URL="$ENV_URL"
                echo "BASE_URL=$BASE_URL" >> "$GITHUB_ENV"
                echo "PREVIEW_AVAILABLE=true" >> "$GITHUB_ENV"
                echo "PREVIEW_STALE=true" >> "$GITHUB_ENV"
                echo "PREVIEW_DEPLOYED_SHA=$CAND_SHA" >> "$GITHUB_ENV"
                printf 'SKIP  Current SHA Preview blocked by Vercel quota: %s\n' "${VERCEL_DESC:-rate limited}" > /tmp/gate.prefix
                printf 'Resolved STALE same-branch Preview: sha=%s url=%s\n' "$CAND_SHA" "$BASE_URL" >> /tmp/gate.prefix
                echo "Resolved stale same-branch Preview $CAND_SHA: $BASE_URL"
                exit 0
              fi
            done <<< "$CANDIDATES"

            # The deployment list can be saturated by >100 rate-limited attempts.
            # Fall back to the last Preview that was actually observed reachable
            # during this gate, but ONLY if Git proves it is an ancestor of HEAD.
            KNOWN_GOOD_SHA="db47b8237d692c9639e1bbf8c268ce0e764d9d72"
            if git merge-base --is-ancestor "$KNOWN_GOOD_SHA" "$WF_SHA" 2>/dev/null; then
              KNOWN_DEP=$(gh api "repos/$WF_REPO/deployments?sha=$KNOWN_GOOD_SHA&per_page=100" --jq '[.[] | select(.environment=="Preview")][0].id // empty' 2>/dev/null || true)
              if [ -n "$KNOWN_DEP" ]; then
                ENV_URL=$(gh api "repos/$WF_REPO/deployments/$KNOWN_DEP/statuses" --jq '[.[] | select(.state=="success" and .environment_url!=null)][0].environment_url // empty' 2>/dev/null || true)
                if [ -n "$ENV_URL" ]; then
                  BASE_URL="$ENV_URL"
                  echo "BASE_URL=$BASE_URL" >> "$GITHUB_ENV"
                  echo "PREVIEW_AVAILABLE=true" >> "$GITHUB_ENV"
                  echo "PREVIEW_STALE=true" >> "$GITHUB_ENV"
                  echo "PREVIEW_DEPLOYED_SHA=$KNOWN_GOOD_SHA" >> "$GITHUB_ENV"
                  printf 'SKIP  Current SHA Preview blocked by Vercel quota: %s\n' "${VERCEL_DESC:-rate limited}" > /tmp/gate.prefix
                  printf 'Resolved STALE ancestor Preview: sha=%s url=%s\n' "$KNOWN_GOOD_SHA" "$BASE_URL" >> /tmp/gate.prefix
                  echo "Resolved known-good ancestor Preview $KNOWN_GOOD_SHA: $BASE_URL"
                  exit 0
                fi
              fi
            fi

            echo "PREVIEW_AVAILABLE=false" >> "$GITHUB_ENV"
            printf 'SKIP  Hosted Preview unavailable: Vercel deployment/build quota (%s); no successful ancestor fallback found\n' "${VERCEL_DESC:-rate limited}" > /tmp/gate.out
            echo "No successful ancestor Preview fallback found."
            exit 0
          fi
          echo "PREVIEW_CURRENT=true" >> "$GITHUB_ENV"

          for i in $(seq 1 30); do
            DEP_ID=$(gh api "repos/$WF_REPO/deployments" | python3 -c '
          import json, sys, os
          sha = os.environ["WF_SHA"]
          try:
              deps = json.load(sys.stdin)
          except Exception:
              print(""); raise SystemExit(0)
          out = [d["id"] for d in deps if d.get("sha") == sha and d.get("environment") == "Preview"]
          print(out[0] if out else "")
          ' 2>/dev/null || true)
            if [ -n "$DEP_ID" ]; then
              ENV_URL=$(gh api "repos/$WF_REPO/deployments/$DEP_ID/statuses" | python3 -c '
          import json, sys
          try:
              sts = json.load(sys.stdin)
          except Exception:
              print(""); raise SystemExit(0)
          out = [st.get("environment_url") or "" for st in sts if st.get("state") == "success"]
          print(out[0] if out else "")
          ' 2>/dev/null || true)
              if [ -n "$ENV_URL" ]; then BASE_URL="$ENV_URL"; break; fi
            fi
            echo "attempt $i: deployment not ready yet"; sleep 10
          done
          [ -n "$BASE_URL" ] || { echo "No successful Preview deployment URL for $WF_SHA"; exit 1; }
          echo "BASE_URL=$BASE_URL" >> "$GITHUB_ENV"
          echo "Resolved Preview deployment: $BASE_URL"

      - name: Wait for deployment to answer
        if: env.PREVIEW_AVAILABLE != 'false'
        run: |
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$BASE_URL/api/health" || true)
            echo "attempt $i: $CODE"
            [ "$CODE" = "200" ] && exit 0
            sleep 10
          done
          echo "deployment never became reachable (protection enabled or URL stale?)"
          exit 1

      - name: Run hosted end-to-end verification
        if: env.PREVIEW_AVAILABLE != 'false'
        run: |
          if [ -f /tmp/gate.prefix ]; then cat /tmp/gate.prefix; fi
          set +e
          bash scripts/hosted-verify.sh 2>&1 | tee /tmp/gate.runtime
          RC=${PIPESTATUS[0]}
          set -e
          { [ -f /tmp/gate.prefix ] && cat /tmp/gate.prefix || true; cat /tmp/gate.runtime; } > /tmp/gate.out
          exit "$RC"

      - name: Publish the gate verdict as a commit comment
        if: always()
        env:
          WF_REPO: ${{ github.repository }}
          WF_SHA: ${{ github.sha }}
          WF_CONCLUSION: ${{ job.status }}
          PREVIEW_STALE: ${{ env.PREVIEW_STALE }}
          PREVIEW_DEPLOYED_SHA: ${{ env.PREVIEW_DEPLOYED_SHA }}
        run: |
          OUT_FILE=/tmp/gate.out
          [ -f "$OUT_FILE" ] || echo "(gate output unavailable — resolve/wait step failed before the harness ran)" > "$OUT_FILE"
          grep -E "^(PASS|FAIL|SKIP|== Summary|Target|Resolved)" "$OUT_FILE" | tail -220 > /tmp/gate.tail || true
          python3 -c '
          import subprocess, sys, os
          repo = os.environ["WF_REPO"]; sha = os.environ["WF_SHA"]; conclusion = os.environ["WF_CONCLUSION"]
          tail = open("/tmp/gate.tail", encoding="utf-8", errors="replace").read() or "(no PASS/FAIL lines captured)"
          stale = os.environ.get("PREVIEW_STALE") == "true"
          deployed = os.environ.get("PREVIEW_DEPLOYED_SHA", "")
          mode = ("STALE SAME-BRANCH DIAGNOSTIC (deployed %s)" % deployed[:12]) if stale else "CURRENT SHA"
          body = "### Hosted Preview verification — %s — %s\n\n```\n%s\n```" % (conclusion.upper(), mode, tail)
          r = subprocess.run(["gh", "api", "repos/%s/commits/%s/comments" % (repo, sha), "-f", "body=" + body], capture_output=True, text=True)
          print(r.stdout[-300:]); print(r.stderr[-300:], file=sys.stderr)
          '
