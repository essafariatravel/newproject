name: Hosted Phase-2 Preview verification

# Runs the pure-HTTP hosted verification harness against the consolidated
# Vercel Preview deployment. Executes on every push to the Phase 2 branch;
# also callable via Actions → "Hosted Phase-2 Preview verification" when the
# workflow file exists on the default branch.
on:
  push:
    branches:
      - arena/01a0c3b8-newproject
    paths:
      - .github/workflows/preview-verify.yml
      - scripts/hosted-verify.sh
  workflow_dispatch:

concurrency:
  group: preview-verify-${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: write # post the gate verdict as a commit comment
  deployments: read

jobs:
  verify:
    name: Verify hosted Preview (Phase 2 flows + Phase 2-Final gate over real HTTP)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PREVIEW_VERIFY_STAFF_EMAIL: ${{ secrets.PREVIEW_VERIFY_STAFF_EMAIL }}
      PREVIEW_VERIFY_STAFF_PASSWORD: ${{ secrets.PREVIEW_VERIFY_STAFF_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve the CURRENT Vercel Preview deployment URL for this commit
        env:
          WF_REPO: ${{ github.repository }}
          WF_SHA: ${{ github.sha }}
        run: |
          BASE_URL=""
          for i in $(seq 1 30); do
            DEP_ID=$(gh api "repos/$WF_REPO/deployments" | python3 -c '
          import json, sys, os
          sha = os.environ["WF_SHA"]
          try:
              deps = json.load(sys.stdin)
          except Exception:
              print(""); raise SystemExit(0)
          out = [d["id"] for d in deps if d.get("sha") == sha and d.get("environment") == "Preview"]
          print(out[0] if out else "")
          ' 2>/dev/null || true)
            if [ -n "$DEP_ID" ]; then
              ENV_URL=$(gh api "repos/$WF_REPO/deployments/$DEP_ID/statuses" | python3 -c '
          import json, sys
          try:
              sts = json.load(sys.stdin)
          except Exception:
              print(""); raise SystemExit(0)
          out = [st.get("environment_url") or "" for st in sts if st.get("state") == "success"]
          print(out[0] if out else "")
          ' 2>/dev/null || true)
              if [ -n "$ENV_URL" ]; then BASE_URL="$ENV_URL"; break; fi
            fi
            echo "attempt $i: deployment not ready yet"; sleep 10
          done
          [ -n "$BASE_URL" ] || { echo "No successful Preview deployment URL for $WF_SHA"; exit 1; }
          echo "BASE_URL=$BASE_URL" >> "$GITHUB_ENV"
          echo "Resolved Preview deployment: $BASE_URL"

      - name: Wait for deployment to answer
        run: |
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$BASE_URL/api/health" || true)
            echo "attempt $i: $CODE"
            [ "$CODE" = "200" ] && exit 0
            sleep 10
          done
          echo "deployment never became reachable (protection enabled or URL stale?)"
          exit 1

      - name: Run hosted end-to-end verification
        run: |
          bash scripts/hosted-verify.sh 2>&1 | tee /tmp/gate.out
          exit ${PIPESTATUS[0]}

      - name: Publish the gate verdict as a commit comment
        if: always()
        env:
          WF_REPO: ${{ github.repository }}
          WF_SHA: ${{ github.sha }}
          WF_CONCLUSION: ${{ job.status }}
        run: |
          OUT_FILE=/tmp/gate.out
          [ -f "$OUT_FILE" ] || echo "(gate output unavailable — resolve/wait step failed before the harness ran)" > "$OUT_FILE"
          grep -E "^(PASS|FAIL|SKIP|== Summary|Target|Resolved)" "$OUT_FILE" | tail -80 > /tmp/gate.tail || true
          python3 -c '
          import subprocess, sys, os
          repo = os.environ["WF_REPO"]; sha = os.environ["WF_SHA"]; conclusion = os.environ["WF_CONCLUSION"]
          tail = open("/tmp/gate.tail", encoding="utf-8", errors="replace").read() or "(no PASS/FAIL lines captured)"
          body = "### Hosted Preview verification — %s\n\n```\n%s\n```" % (conclusion.upper(), tail)
          r = subprocess.run(["gh", "api", "repos/%s/commits/%s/comments" % (repo, sha), "-f", "body=" + body], capture_output=True, text=True)
          print(r.stdout[-300:]); print(r.stderr[-300:], file=sys.stderr)
          '
