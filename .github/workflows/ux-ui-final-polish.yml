name: UX UI Final Polish Verification

on:
  push:
    branches:
      - design/ux-ui-final-polish
  workflow_dispatch:

concurrency:
  group: ux-ui-final-polish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, lint, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL: "0"
      VERCEL_ENV: ""
      DATABASE_URL: ""
      ALLOW_DEMO_SEED: "false"
      STORAGE_PROVIDER: "db"
      CI: "true"
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify checkout
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Deep UX/UI static audit
        run: node scripts/ux-ui-deep-audit.mjs

      - name: UX/UI polish guards
        run: npm test -- tests/ux-ui-*.test.ts

      - name: Full deterministic test suite
        run: npm test

      - name: Build without deployment or database access
        run: npm run build
