# Temporary, non-deploying qualification for ESSAFARIA PR #16.
# No repository secrets, no Vercel/Supabase credentials and no hosted k6 execution.
name: PR16 Offline Safety Qualification

on:
  push:
    branches:
      - security/block-hosted-k6-hobby-2026-10-10
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr16-offline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: Offline typecheck, lint, Vitest and build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "true"
      VERCEL: "0"
      VERCEL_ENV: ""
      NEXT_TELEMETRY_DISABLED: "1"
      DO_NOT_TRACK: "1"
      ALLOW_DEMO_SEED: "false"
      STORAGE_PROVIDER: "db"
      BASE_URL: "http://127.0.0.1:3000"
      DATABASE_URL: ""
      DATABASE_SCHEMA: "public"
    steps:
      - name: Checkout exact PR head without credentials
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify exact commit
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Set up Node 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify hosted k6 policy and all three repaired regression fixtures
        run: >-
          npm test --
          tests/hosted-k6-policy.test.ts
          tests/performance-active-session.test.ts
          tests/performance-k6-session-path.test.ts
          tests/performance-windows-evaluation.test.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Full deterministic regression (local disposable database only)
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5434/essafaria_test
          DATABASE_SCHEMA: public
        run: npm test

      - name: Build offline, no database or Vercel connectivity
        env:
          DATABASE_URL: ""
          VERCEL: "0"
          VERCEL_ENV: ""
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build
