name: Performance Gate preparation verification

on:
  push:
    branches:
      - perf/performance-gate-prep
  workflow_dispatch:

concurrency:
  group: performance-gate-prep-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify additive performance pack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL: "0"
      VERCEL_ENV: ""
      DATABASE_URL: ""
      DATABASE_SCHEMA: ""
      ALLOW_DEMO_SEED: "false"
      STORAGE_PROVIDER: "db"
      CI: "true"

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify checkout
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "Verified commit: $GITHUB_SHA"

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Parse k6 harness syntax
        run: |
          node --check perf/k6/essafaria-load.js
          node --check perf/k6/essafaria-exports.js

      - name: Verify performance safety guard
        run: npm test -- tests/performance-safety.test.ts

      - name: Verify wallet race invariants
        run: npm test -- tests/performance-wallet-races.test.ts

      - name: Verify concurrent 2 MB storage reliability
        run: npm test -- tests/performance-storage-concurrency.test.ts

      - name: Verify fail-closed performance verdict tooling
        run: npm test -- tests/performance-verdict-tooling.test.ts

      - name: Validate synthetic scale seeder on disposable local PostgreSQL
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/essafaria
          DATABASE_SCHEMA: public
          PERF_ACK_NONPROD: "YES"
          PERF_SYNTHETIC_PASSWORD: "ci-only-performance-secret-2026"
          PERF_DATASET_ID: ci-scale
          PERF_APPLICATIONS: "100"
          PERF_AGENCIES: "10"
          PERF_DOCS_PER_APP: "2"
          PERF_NOTIFICATIONS_PER_APP: "2"
          PERF_MESSAGES_PER_APP: "1"
          PERF_AUDITS_PER_APP: "2"
          PERF_LEDGER_ROWS: "100"
        shell: bash
        run: |
          npm run db:up >/tmp/perf-pg.log 2>&1 &
          PG_PID=$!
          trap 'kill "$PG_PID" >/dev/null 2>&1 || true' EXIT
          READY=0
          for i in $(seq 1 45); do
            if (echo > /dev/tcp/127.0.0.1/5432) >/dev/null 2>&1; then READY=1; break; fi
            sleep 1
          done
          if [ "$READY" != "1" ]; then
            cat /tmp/perf-pg.log
            exit 1
          fi
          npm run db:setup
          npx tsx scripts/perf-seed-identities.ts
          npx tsx scripts/perf-seed-scale.ts
          node <<'NODE'
          const { Pool } = require("pg");
          (async () => {
            const pool = new Pool({ connectionString: process.env.DATABASE_URL });
            const q = async (sql) => Number((await pool.query(sql)).rows[0].n);
            const checks = {
              applications: await q("select count(*)::int n from applications where agency_notes='PERF_DATASET:ci-scale'"),
              documents: await q("select count(*)::int n from documents d join applications a on a.id=d.application_id where a.agency_notes='PERF_DATASET:ci-scale'"),
              notifications: await q("select count(*)::int n from notifications n join applications a on a.id=n.application_id where a.agency_notes='PERF_DATASET:ci-scale'"),
              communications: await q("select count(*)::int n from communications c join applications a on a.id=c.application_id where a.agency_notes='PERF_DATASET:ci-scale'"),
              audits: await q("select count(*)::int n from audit_logs l join applications a on a.id::text=l.entity_id where a.agency_notes='PERF_DATASET:ci-scale' and l.action='PERF_SYNTHETIC_EVENT'"),
              ledger: await q("select count(*)::int n from wallet_transactions where reason='PERF_DATASET:ci-scale:LEDGER'"),
            };
            await pool.end();
            const expected = { applications:100, documents:200, notifications:200, communications:100, audits:200, ledger:100 };
            for (const [key, value] of Object.entries(expected)) {
              if (checks[key] !== value) throw new Error(`${key}: expected ${value}, got ${checks[key]}`);
            }
            console.log(JSON.stringify(checks));
          })().catch((err) => { console.error(err); process.exit(1); });
          NODE
          PERF_BENCH_REPEATS=2 PERF_BENCH_OUTPUT=perf/results/ci-query-benchmark.json npm run perf:benchmark
          PERF_ALLOW_EXPLAIN_ANALYZE=YES PERF_EXPLAIN_OUTPUT=perf/results/ci-explain.json npm run perf:explain
          PERF_EXPLAIN_INPUT=perf/results/ci-explain.json npm run perf:index-advisor > perf/results/ci-index-advisor.json
          npm run perf:regression -- perf/results/ci-query-benchmark.json perf/results/ci-query-benchmark.json

          mkdir -p perf/results
          cat > perf/results/ci-k6-summary.json <<'JSON'
          {
            "metrics": {
              "http_req_duration": {"values":{"med":100,"p(95)":200,"p(99)":300}},
              "http_req_failed": {"values":{"rate":0}},
              "unexpected_failure": {"values":{"rate":0}},
              "http_reqs": {"values":{"rate":12.5}},
              "http_req_duration{operation:agency_dashboard}": {"values":{"p(95)":200,"p(99)":300}}
            }
          }
          JSON
          cat > perf/results/ci-db-before.json <<'JSON'
          {"waitingLocks":0,"databaseStats":[{"deadlocks":0}]}
          JSON
          cat > perf/results/ci-db-after.json <<'JSON'
          {"waitingLocks":0,"databaseStats":[{"deadlocks":0}]}
          JSON
          cat > perf/results/ci-report-manifest.json <<'JSON'
          {
            "environment":"ci-disposable-postgres",
            "commit":"CI",
            "walletCorrectness":true,
            "storageCorrectness":true,
            "runs":[{
              "label":"10-vu",
              "vus":10,
              "summary":"perf/results/ci-k6-summary.json",
              "beforeDb":"perf/results/ci-db-before.json",
              "afterDb":"perf/results/ci-db-after.json"
            }]
          }
          JSON
          npm run perf:report -- perf/results/ci-report-manifest.json perf/results/ci-performance-report.md
          grep -q "PASS WITH CAPACITY LIMIT" perf/results/ci-performance-report.md

          PERF_ALLOW_LIVE_WALLET=YES npx tsx scripts/perf-wallet-races-live.ts
          PERF_ALLOW_LIVE_STORAGE=YES npx tsx scripts/perf-storage-live.ts

      - name: Build without deployment or remote database access
        run: npm run build
