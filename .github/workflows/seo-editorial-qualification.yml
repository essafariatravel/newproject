name: SEO editorial evidence - isolated qualification
on:
  push:
    branches:
      - seo/editorial-evidence-20261112
      - seo/gsc-verified-lastmod-20261114

permissions:
  contents: read

jobs:
  qualify:
    name: SEO checks without secrets or database
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      VERCEL: "0"
      VERCEL_ENV: ""
      ALLOW_DEMO_SEED: "false"
      DATABASE_URL: ""
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Public SEO and isolation tests
        run: npx vitest run tests/seo-editorial-evidence.test.ts tests/seo-company-identity.test.ts tests/seo-indexation.test.ts tests/seo-partner-content.test.ts tests/seo-public-performance.test.ts tests/seo-route-policy.test.ts tests/build-preview-guard.test.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
