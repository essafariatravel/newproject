name: Restore Original Approved UX UI

on:
  push:
    branches:
      - restore/original-approved-ux-ui
    paths:
      - .github/workflows/restore-original-approved-ux.yml

permissions:
  contents: write

jobs:
  restore:
    if: github.event.head_commit.message == 'Apply conflict-safe approved UX subset'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout restoration branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Verify frozen RC ancestry
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 8b4b44d0bbaf312d96cadbd438ec4193e58d278b HEAD

      - name: Build frontend-only patch from approved polish
        shell: bash
        run: |
          set -euo pipefail
          BASE="1698562a05f8bd5c36027651d987a06bb60510f9"
          APPROVED="a774203ec525f543e75a076cf867024a2a1af506"
          git diff --binary --full-index "$BASE" "$APPROVED" --             ':(glob)src/app/**/*.tsx'             'src/app/globals.css'             'src/app/travel-platform.css'             ':(glob)src/components/**/*.tsx'             'src/lib/i18n-content.ts'             > /tmp/original-approved-ui.patch
          test -s /tmp/original-approved-ui.patch

      - name: Apply clean hunks and retain current RC on conflicts
        shell: bash
        run: |
          set -euo pipefail
          git apply --3way --index --whitespace=nowarn /tmp/original-approved-ui.patch || true

          conflicts="$(git diff --name-only --diff-filter=U)"
          if [ -n "$conflicts" ]; then
            echo "Conflicted files retained from current RC:"
            printf '%s\n' "$conflicts"
            while IFS= read -r file; do
              [ -n "$file" ] || continue
              git checkout --ours -- "$file"
              git add "$file"
            done <<< "$conflicts"
          fi

          if git diff --cached --quiet; then
            echo "::error::No conflict-free approved UX changes were applicable."
            exit 1
          fi

      - name: Enforce frontend-only scope
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --cached --name-only)"
          printf '%s\n' "$changed"
          bad="$(printf '%s\n' "$changed" | grep -Ev '^(src/app/.*\.tsx|src/app/(globals|travel-platform)\.css|src/components/.*\.tsx|src/lib/i18n-content\.ts)$' || true)"
          test -z "$bad" || { echo "::error::Restoration escaped frontend-only scope"; printf '%s\n' "$bad"; exit 1; }
          if printf '%s\n' "$changed" | grep -Eq '^(src/app/api/|src/app/actions/|src/db/|migrations/|src/lib/(auth|wallet|storage|rbac|security))'; then
            echo "::error::Protected backend/security path touched."
            exit 1
          fi

      - name: Commit conflict-free restored subset
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Restore conflict-free approved UX presentation subset"
          git push origin HEAD:restore/original-approved-ux-ui
