name: Final Original UX Restoration Validation

on:
  push:
    branches:
      - restore/original-approved-ux-ui
    paths:
      - .github/workflows/restore-original-approved-ux.yml

permissions:
  contents: read

jobs:
  validate:
    if: github.event.head_commit.message == 'Run final authoritative UX restoration validation'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VERCEL: "0"
      VERCEL_ENV: ""
      DATABASE_URL: ""
      ALLOW_DEMO_SEED: "false"
      STORAGE_PROVIDER: "db"
      CI: "true"

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Verify checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 8b4b44d0bbaf312d96cadbd438ec4193e58d278b HEAD
          echo "Validated restoration SHA: $GITHUB_SHA"

      - name: Setup Node 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Security static gate
        run: npx tsx scripts/security-static-gate.ts

      - name: Security history gate
        run: npx tsx scripts/security-history-gate.ts

      - name: Immutable GitHub Actions gate
        run: npx tsx scripts/security-actions-gate.ts

      - name: Dangerous source construct gate
        run: npx tsx scripts/security-source-gate.ts

      - name: Production dependency vulnerability gate
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Targeted UX invariants
        run: npm test -- tests/phase2-final.test.ts tests/public-mobile-50.test.ts

      - name: Full test suite — single authoritative run
        run: npm test

      - name: Optimized build — non-deploying
        run: npm run build

      - name: Browser responsive and RTL verification
        shell: bash
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/essafaria
          DATABASE_SCHEMA: public
          STORAGE_PROVIDER: db
          BASE_URL: http://127.0.0.1:3011
          PORT: "3011"
          SEED_ADMIN_PASSWORD: Admin!2345
          SEED_AGENCY_PASSWORD: Agency!2345
        run: |
          set -euo pipefail

          npm run db:up > /tmp/ux-pg.log 2>&1 &
          PG_PID=$!
          APP_PID=""
          cleanup() {
            if [ -n "$APP_PID" ]; then kill "$APP_PID" 2>/dev/null || true; fi
            kill "$PG_PID" 2>/dev/null || true
            rm -f scripts/_ux-restoration-browser.mjs
          }
          trap cleanup EXIT

          for i in $(seq 1 60); do
            if (echo > /dev/tcp/127.0.0.1/5432) >/dev/null 2>&1; then break; fi
            if [ "$i" = "60" ]; then cat /tmp/ux-pg.log; exit 1; fi
            sleep 1
          done

          npm run db:migrate
          npm run db:seed

          npm start > /tmp/ux-next.log 2>&1 &
          APP_PID=$!
          for i in $(seq 1 60); do
            if curl -fsS --max-time 3 "$BASE_URL/" >/dev/null 2>&1; then break; fi
            if [ "$i" = "60" ]; then cat /tmp/ux-next.log; exit 1; fi
            sleep 1
          done

          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium

          cat > scripts/_ux-restoration-browser.mjs <<'JS'
          import { chromium } from "playwright";

          const base = process.env.BASE_URL;
          const widths = [320, 390, 768, 1440];
          const browser = await chromium.launch({ headless: true });
          const failures = [];

          const assert = (condition, message) => {
            if (!condition) failures.push(message);
          };

          async function assertPage(page, route, width, label) {
            await page.setViewportSize({ width, height: width <= 390 ? 844 : 1000 });
            const response = await page.goto(base + route, { waitUntil: "networkidle" });
            assert(response && response.ok(), `${label} ${route} ${width}px HTTP ${response?.status()}`);
            const metrics = await page.evaluate(() => ({
              scrollWidth: document.documentElement.scrollWidth,
              clientWidth: document.documentElement.clientWidth,
              dir: document.documentElement.getAttribute("dir"),
              lang: document.documentElement.getAttribute("lang"),
              bodyText: document.body.innerText.slice(0, 2000),
            }));
            assert(metrics.scrollWidth <= metrics.clientWidth + 1,
              `${label} ${route} ${width}px horizontal overflow: ${metrics.scrollWidth} > ${metrics.clientWidth}`);
            assert(!metrics.bodyText.includes("Application error"),
              `${label} ${route} ${width}px rendered application error`);
            console.log(`PASS ${label} ${route} ${width}px dir=${metrics.dir} lang=${metrics.lang} width=${metrics.scrollWidth}/${metrics.clientWidth}`);
          }

          async function login(context, identifier, password) {
            const page = await context.newPage();
            await page.goto(base + "/login", { waitUntil: "networkidle" });
            await page.locator('input[name="identifier"]').fill(identifier);
            await page.locator('input[name="password"]').fill(password);
            await Promise.all([
              page.waitForURL(url => !url.pathname.endsWith("/login"), { timeout: 20000 }),
              page.locator('button[type="submit"]').click(),
            ]);
            return page;
          }

          // Public/Auth at all requested widths.
          {
            const context = await browser.newContext();
            const page = await context.newPage();
            for (const width of widths) {
              await assertPage(page, "/", width, "PUBLIC");
              await assertPage(page, "/login", width, "AUTH");
            }
            await context.close();
          }

          // Agency portal.
          {
            const context = await browser.newContext();
            const page = await login(context, "admin@horizonvoyages.example", "Agency!2345");
            for (const width of widths) {
              await assertPage(page, "/portal", width, "AGENCY");
              await assertPage(page, "/portal/applications", width, "AGENCY");
            }
            await context.addCookies([{ name: "evos_ui_locale", value: "ar", url: base }]);
            await assertPage(page, "/portal", 390, "AGENCY-AR");
            const agencyDir = await page.evaluate(() => document.documentElement.dir);
            assert(agencyDir === "rtl", `Agency Arabic dir expected rtl, got ${agencyDir}`);
            await context.close();
          }

          // Staff/back office.
          {
            const context = await browser.newContext();
            const page = await login(context, "superadmin@essafaria.example", "Admin!2345");
            for (const width of widths) {
              await assertPage(page, "/admin", width, "STAFF");
              await assertPage(page, "/admin/applications", width, "STAFF");
            }
            await context.addCookies([{ name: "evos_ui_locale", value: "ar", url: base }]);
            await assertPage(page, "/admin", 1440, "STAFF-AR");
            const staffDir = await page.evaluate(() => document.documentElement.dir);
            assert(staffDir === "rtl", `Staff Arabic dir expected rtl, got ${staffDir}`);
            await context.close();
          }

          await browser.close();
          if (failures.length) {
            console.error("\nUX validation failures:");
            for (const failure of failures) console.error("- " + failure);
            process.exit(1);
          }
          console.log("Responsive/RTL browser verification PASS");
          JS

          node scripts/_ux-restoration-browser.mjs
