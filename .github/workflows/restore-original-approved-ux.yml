name: Restore Original Approved UX UI
on:
  push:
    branches: [restore/original-approved-ux-ui]
    paths: [.github/workflows/restore-original-approved-ux.yml, scripts/restore-approved-ui-safe-hunks.sh, scripts/restore-approved-ui-conflicts.py]
permissions:
  contents: write
jobs:
  restore:
    if: github.event.head_commit.message == 'Run safe approved UX hunk restoration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Restore safe visual hunks
        run: bash scripts/restore-approved-ui-safe-hunks.sh
