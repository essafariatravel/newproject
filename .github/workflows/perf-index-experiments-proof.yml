name: Performance disposable index A-B experiments

on:
  push:
    branches:
      - perf/performance-gate-prep
    paths:
      - .github/workflows/perf-index-experiments-proof.yml

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERCEL: "0"
      VERCEL_ENV: ""
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/essafaria
      DATABASE_SCHEMA: public
      PERF_ACK_NONPROD: "YES"
      PERF_SYNTHETIC_PASSWORD: "ci-only-performance-secret-2026"
      STORAGE_PROVIDER: db
      ALLOW_DEMO_SEED: "false"
      CI: "true"

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund

      - name: Start disposable PostgreSQL
        shell: bash
        run: |
          npm run db:up >/tmp/perf-pg.log 2>&1 &
          echo $! > /tmp/perf-pg.pid
          READY=0
          for i in $(seq 1 45); do
            if (echo > /dev/tcp/127.0.0.1/5432) >/dev/null 2>&1; then READY=1; break; fi
            sleep 1
          done
          if [ "$READY" != "1" ]; then cat /tmp/perf-pg.log; exit 1; fi
          npm run db:setup
          npm run perf:seed-identities

      - name: Seed 100k workload for exact-shape experiments
        shell: bash
        run: |
          PERF_DATASET_ID=indexab100k \
          PERF_APPLICATIONS=100000 \
          PERF_AGENCIES=1000 \
          PERF_DOCS_PER_APP=0 \
          PERF_NOTIFICATIONS_PER_APP=3 \
          PERF_MESSAGES_PER_APP=1 \
          PERF_AUDITS_PER_APP=0 \
          PERF_LEDGER_ROWS=0 \
          PERF_BATCH_SIZE=2000 \
          npm run perf:seed-scale

      - name: Run exact-shape A-B index experiments with symmetric warm-up
        shell: bash
        run: |
          mkdir -p perf/results
          PERF_INDEX_EXPERIMENT_REPEATS=30 \
          PERF_INDEX_EXPERIMENT_OUTPUT=perf/results/index-ab-experiments.json \
          npm run perf:index-experiment

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: index-ab-experiments-${{ github.sha }}
          path: perf/results/
          if-no-files-found: error
          retention-days: 14

      - name: Stop disposable PostgreSQL
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/perf-pg.pid ]; then kill "$(cat /tmp/perf-pg.pid)" >/dev/null 2>&1 || true; fi
